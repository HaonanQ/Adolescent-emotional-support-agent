  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: backend-ai-agent
  #   ports:
  #     - "8123:8123"
  #   environment:
  #     # 数据库配置 - MySQL（用户使用本地MySQL）
  #     SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
  #     SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3308/loveai
  #     SPRING_DATASOURCE_USERNAME: root
  #     SPRING_DATASOURCE_PASSWORD: 123456qhnan
  #     # PostgreSQL配置
  #     SPRING_DATASOURCE_PG_DRIVER_CLASS_NAME: org.postgresql.Driver
  #     SPRING_DATASOURCE_PG_URL: jdbc:postgresql://postgres:5432/teen_emotion_rag
  #     SPRING_DATASOURCE_PG_USERNAME: postgres
  #     SPRING_DATASOURCE_PG_PASSWORD: 123456
  #     # Redis配置
  #     SPRING_DATA_REDIS_HOST: redis
  #     SPRING_DATA_REDIS_PORT: 6379
  #     SPRING_DATA_REDIS_PASSWORD: 123456
