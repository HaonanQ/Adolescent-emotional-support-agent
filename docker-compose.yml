version: '3.8'

services:
  # MySQL 数据库（用于 MyBatis）
  mysql:
    image: mysql:8.0.43
    container_name: mysql-ai-agent
    environment:
      MYSQL_ROOT_PASSWORD: 123456qhnan
      MYSQL_DATABASE: agent
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456qhnan"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  # PostgreSQL 数据库（用于 Spring AI PgVector 向量存储）
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres-ai-agent
    environment:
      POSTGRES_DB: teen_emotion_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存（用于会话存储）
  redis:
    image: redis:7-alpine
    container_name: redis-ai-agent
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --requirepass 123456

  # MongoDB 数据库（用于数据存储）
  mongodb:
    image: mongo:7
    container_name: mongodb-ai-agent
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: agent
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务（暂时注释，先启动其他服务）
